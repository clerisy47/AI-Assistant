[project]
name = "ai-assistant"
version = "0.1.0"
description = "Provider-agnostic FastAPI LLM assistant with RAG, tool calling, and verified research"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "python-multipart==0.0.32",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.2",
    "anthropic==0.122.0",
    "openai==3.1.0",
    "qdrant-client==1.19.0",
    "sentence-transformers==5.7.0",
    "pypdf==6.16.1",
    "tenacity==9.1.4",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "PyYAML==6.0.3",
]
# Airflow stays out of the default mlops extra until Phase 13 (heavy install).
mlops = [
    "mlflow>=2.14,<4",
    "evidently>=0.4.40,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
