  <text x="810" y="466" text-anchor="middle" font-size="10" fill="#5b21b6">draft + EvidenceNotes only</text>
  <text x="810" y="480" text-anchor="middle" font-size="10" fill="#5b21b6">not full tool dump</text>
  <text x="810" y="496" text-anchor="middle" font-size="9.5" fill="#6b7280">sufficient / revise / clarify</text>

