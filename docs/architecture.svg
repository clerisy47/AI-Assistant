  <text x="700" y="108" text-anchor="middle" font-size="11" fill="#475569">curl · Swagger UI (/docs) · any HTTP client</text>

  <line x1="700" y1="120" x2="700" y2="146" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
