  <text x="260" y="380" text-anchor="middle" font-size="10.5" fill="#334155">multi-turn tool loop · tool trace · max iterations</text>

  <line x1="260" y1="396" x2="260" y2="416" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <rect x="86" y="418" width="348" height="86" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="260" y="440" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Tool Registry</text>
  <text x="260" y="458" text-anchor="middle" font-size="10.5" fill="#334155">calculator · get_current_datetime</text>
  <text x="260" y="474" text-anchor="middle" font-size="10.5" fill="#334155">search_knowledge_base</text>
  <text x="260" y="490" text-anchor="middle" font-size="10" fill="#64748b">→ RAG pipeline below</text>

