  <text x="700" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Supervisor</text>
  <text x="700" y="376" text-anchor="middle" font-size="10.5" fill="#5b21b6">iteration / tool budgets · stop reasons · token rollup</text>

