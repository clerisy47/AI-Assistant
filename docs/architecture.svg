  <text x="710" y="294" font-size="10" fill="#7c3aed">/research</text>

  <!-- Classic path -->
  <rect x="68" y="304" width="384" height="220" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="86" y="326" font-size="12" font-weight="700" fill="#1e3a8a">Classic path (unchanged)</text>

  <rect x="86" y="340" width="348" height="56" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
