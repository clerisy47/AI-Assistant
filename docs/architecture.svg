  <line x1="820" y1="388" x2="820" y2="410" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <rect x="490" y="412" width="200" height="100" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="590" y="434" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">Research Agent</text>
  <text x="590" y="452" text-anchor="middle" font-size="10" fill="#5b21b6">search_knowledge_base</text>
  <text x="590" y="466" text-anchor="middle" font-size="10" fill="#5b21b6">load_skill · update_evidence_notes</text>
  <text x="590" y="480" text-anchor="middle" font-size="10" fill="#5b21b6">ask_clarification (+ builtins)</text>
  <text x="590" y="496" text-anchor="middle" font-size="9.5" fill="#6b7280">capped tool results</text>

  <rect x="710" y="412" width="200" height="100" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="810" y="434" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">Verifier Agent</text>
