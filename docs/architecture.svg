  <path d="M690,462 h20" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <path d="M710,478 h-20" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="700" y="456" text-anchor="middle" font-size="9" fill="#7c3aed">draft</text>
  <text x="700" y="492" text-anchor="middle" font-size="9" fill="#7c3aed">issues</text>

  <rect x="490" y="528" width="200" height="56" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="590" y="550" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">Skill progressive disclosure</text>
  <text x="590" y="568" text-anchor="middle" font-size="10" fill="#5b21b6">skills/verified_research/SKILL.md</text>

  <rect x="710" y="528" width="200" height="56" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="810" y="550" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">EvidenceNotes</text>
  <text x="810" y="568" text-anchor="middle" font-size="10" fill="#5b21b6">structured external notes</text>

  <line x1="590" y1="512" x2="590" y2="528" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrowPurple)"/>
  <line x1="810" y1="512" x2="810" y2="528" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrowPurple)"/>
  <line x1="590" y1="528" x2="590" y2="512" stroke="none"/>

  <!-- Shared LLM + RAG -->
  <rect x="68" y="664" width="860" height="56" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="498" y="686" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">LLM Provider Interface</text>
  <text x="498" y="704" text-anchor="middle" font-size="10.5" fill="#334155">strict tool schemas · native structured output · token usage (prompt / completion / total)</text>

  <rect x="68" y="740" width="860" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="498" y="762" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">RAG Pipeline</text>
  <text x="498" y="780" text-anchor="middle" font-size="10.5" fill="#334155">Ingestion → Chunker (sentence-aware, overlap) → Local Embedder → Retriever</text>
  <text x="498" y="796" text-anchor="middle" font-size="10" fill="#64748b">used by /chat tool, /rag/query, and research search_knowledge_base (results capped)</text>

  <text x="86" y="846" font-size="10.5" fill="#64748b">Shared providers: Orchestrator, Research, and Verifier all call LLMProvider — Qdrant retrieval is a</text>
  <text x="86" y="862" font-size="10.5" fill="#64748b">bounded tool, not a peer agent. Hard stops: verified · clarification · max_iterations · max_tool_calls · tool_failure.</text>
  <text x="86" y="886" font-size="10.5" fill="#64748b">Container: python:3.11-slim · non-root · HEALTHCHECK /health · RAG startup timeout-bounded (45s).</text>
  <text x="86" y="906" font-size="10.5" fill="#64748b">Eval: make eval → eval/report.md (scripted provider; no live LLM required).</text>

  <!-- arrows into shared layers -->
  <line x1="260" y1="524" x2="260" y2="664" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
