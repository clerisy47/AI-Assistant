# Default mode (cloud LLM provider):
#   docker compose up --build
#
# Fully local mode (adds a GPU-backed vLLM server, no cloud API key needed):
#   docker compose --profile local-llm up --build
#   (and set LLM_PROVIDER=local in .env)

services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Always point at the Compose service name, regardless of what's in .env.
      QDRANT_URL: http://qdrant:6333
    depends_on:
      # Ordering only -- the official qdrant/qdrant image ships without
      # curl/wget/a shell utility a Compose `healthcheck:` could use
      # (a deliberate upstream choice, see qdrant/qdrant#4250), so a
      # healthcheck-gated `condition: service_healthy` isn't reliably
      # available here. Real readiness is handled by the app's own
      # connect-with-retry logic in app/rag/vector_store.py instead.
      - qdrant
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Optional: serve an open-source model locally instead of calling a cloud
  # API. Requires an NVIDIA GPU + the NVIDIA Container Toolkit on the host.
  # Not started by default -- only with `--profile local-llm`.
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["local-llm"]
    command: >
      --model ${VLLM_MODEL:-meta-llama/Meta-Llama-3.1-8B-Instruct}
      --enable-auto-tool-choice
      --tool-call-parser llama3_json
      --chat-template examples/tool_chat_template_llama3.1_json.jinja
      --max-model-len 8192
    ports:
      - "8000:8000"
    volumes:
      - hf_cache_vllm:/root/.cache/huggingface
    # vLLM needs a larger shared-memory segment than Docker's tiny default;
    # ipc: host is the standard fix (see vLLM's own deployment docs).
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  qdrant_data:
  hf_cache:
  hf_cache_vllm:
